<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#122b2a">
  <title>MoveGraph — See your next move</title>
  <meta name="description" content="See how the pieces of your move connect. Explore a change, understand its consequences, and make a plan you can trust.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%23122b2a'/%3E%3Cpath d='M10 28V12l10 9 10-9v16' fill='none' stroke='%237fe1ba' stroke-width='3' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="interactions.css">
</head>
<body>
  <div class="app-shell">
    <main class="main-area">
      <header class="topbar">
        <a href="./" class="brand" aria-label="MoveGraph home"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M6 25V7l10 11L26 7v18"/></svg>MoveGraph</a>
        <div class="move-context">San Francisco <span>→</span> Berlin <span class="arrival-context">· Arrive 18 Oct</span></div>
        <button class="about-button" id="about-button">About</button>
      </header>
      <section class="page-heading"><div><h1>Change a date. See what follows.</h1><p>Built from four years across seven cities. Select a step to inspect or change it.</p></div><button class="button button-quiet" id="undo-button" hidden><span>↶</span> Undo change</button></section>
      <section class="plan-overview" aria-label="Plan overview" role="status" aria-live="polite"><div class="overview-primary"><div><strong id="plan-health">On track</strong><span id="plan-summary">Ready 10 Oct · 8-day buffer before arrival</span></div></div></section>
      <section class="workspace" aria-label="Move planning workspace">
        <div class="graph-section">
          <div class="surface-toolbar"></div>
          <div class="graph-viewport" id="graph-viewport"><div class="graph-canvas" id="graph-canvas"></div><div class="graph-legend"></div></div>
          <div class="timeline-section" hidden></div>
        </div>
        <aside class="inspector" id="inspector" aria-label="Selected step details"></aside>
      </section>
      <footer class="page-footer"><span>Illustrative dates and assumptions · Not official relocation requirements</span></footer>
    </main>
  </div>
  <div id="overlay-root"></div><div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
